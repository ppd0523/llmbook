site_name: llmBook
site_description: 개발 문서를 책 단위로 정리한 지식 저장소
# CI는 GitHub Pages가 알려 준 주소를 SITE_URL로 넘긴다. 로컬 빌드는 기본값을 쓴다.
site_url: !ENV [SITE_URL, "https://ppd0523.github.io/llmbook/"]
repo_name: ppd0523/llmbook
repo_url: https://github.com/ppd0523/llmbook
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  custom_dir: overrides
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang: ko
  - awesome-pages

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/nav-numbering.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

exclude_docs: |
  !nixos-wsl-dev-environment/assets/example-config/.gitignore
  **/_work/**
  **/examples/**/*.md

not_in_nav: |
  **/assets/**/*.md
