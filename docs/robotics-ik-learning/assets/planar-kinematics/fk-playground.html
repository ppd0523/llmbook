<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2관절 팔 FK 놀이터</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; color: light-dark(#1f2937, #e5e7eb); background: light-dark(#fafafa, #111827); }
    body { margin: 0; }
    main { max-width: 1060px; margin: auto; padding: 24px 18px 48px; }
    h1 { margin: 0 0 6px; font-size: 1.55rem; }
    .intro, .hint { color: light-dark(#4b5563, #cbd5e1); }
    .layout { display: grid; grid-template-columns: minmax(260px, 330px) 1fr; gap: 22px; align-items: start; margin-top: 22px; }
    .panel, .canvas-wrap { background: light-dark(#ffffff, #182234); border: 1px solid light-dark(#d1d5db, #334155); border-radius: 12px; padding: 18px; }
    .control { margin: 0 0 20px; }
    label { display: flex; justify-content: space-between; gap: 12px; font-weight: 650; }
    output { font-variant-numeric: tabular-nums; color: light-dark(#075985, #7dd3fc); }
    input[type="range"] { width: 100%; margin-top: 8px; accent-color: light-dark(#0284c7, #38bdf8); }
    .values { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .value { background: light-dark(#f3f4f6, #0f172a); border-radius: 8px; padding: 10px; }
    .value span { display: block; color: light-dark(#64748b, #94a3b8); font-size: .82rem; }
    .value strong { display: block; margin-top: 3px; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
    canvas { display: block; width: 100%; aspect-ratio: 1.25; touch-action: none; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: .9rem; }
    .dot { display: inline-block; width: .7em; height: .7em; margin-right: .3em; border-radius: 50%; background: #2563eb; }
    .dot.two { background: #f97316; }
    code { background: light-dark(#e5e7eb, #0f172a); padding: .12em .3em; border-radius: 4px; }
    @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>2관절 평면 팔: 순기구학(FK) 놀이터</h1>
    <p class="intro">관절각을 바꾸고, 링크 2의 세계 기준 방향이 <code>θ₁ + θ₂</code>가 되는 것을 확인하세요.</p>
    <div class="layout">
      <section class="panel" aria-label="관절과 링크 입력">
        <div class="control">
          <label for="l1">링크 1 길이 <output id="l1-out"></output></label>
          <input id="l1" type="range" min="1" max="5" step="0.1" value="3">
        </div>
        <div class="control">
          <label for="l2">링크 2 길이 <output id="l2-out"></output></label>
          <input id="l2" type="range" min="1" max="5" step="0.1" value="2">
        </div>
        <div class="control">
          <label for="t1">관절각 θ₁ <output id="t1-out"></output></label>
          <input id="t1" type="range" min="-180" max="180" step="1" value="0">
        </div>
        <div class="control">
          <label for="t2">관절각 θ₂ <output id="t2-out"></output></label>
          <input id="t2" type="range" min="-180" max="180" step="1" value="90">
        </div>
        <div class="values" aria-live="polite">
          <div class="value"><span>팔꿈치 x₁</span><strong id="x1-value"></strong></div>
          <div class="value"><span>팔꿈치 y₁</span><strong id="y1-value"></strong></div>
          <div class="value"><span>손 위치 x</span><strong id="x-value"></strong></div>
          <div class="value"><span>손 위치 y</span><strong id="y-value"></strong></div>
          <div class="value"><span>링크 2 방향</span><strong id="direction-value"></strong></div>
          <div class="value"><span>손까지 거리</span><strong id="radius-value"></strong></div>
        </div>
      </section>
      <section class="canvas-wrap">
        <canvas id="scene" role="img" aria-label="두 개의 회전 관절을 가진 평면 로봇 팔 그림"></canvas>
        <div class="legend"><span><i class="dot"></i>링크 1</span><span><i class="dot two"></i>링크 2</span><span class="hint">축 눈금: 길이 단위 1</span></div>
      </section>
    </div>
    <p class="hint">실험: θ₁을 30°, θ₂를 60°로 놓으세요. 링크 2가 x축에서 90°를 향하고, 손 위치가 (3√3/2, 7/2)가 되는지 관찰하세요.</p>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const inputs = ['l1', 'l2', 't1', 't2'].map($);
    const canvas = $('scene');
    const ctx = canvas.getContext('2d');
    const rad = (degree) => degree * Math.PI / 180;
    const fmt = (value) => Number(value).toFixed(2);

    function drawLine(a, b, color, width) {
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.stroke();
    }
    function drawJoint(p, fill, radius = 7) {
      ctx.beginPath(); ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
    }
    function update() {
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const colors = dark
        ? { grid: '#334155', axis: '#94a3b8', text: '#cbd5e1', origin: '#f8fafc' }
        : { grid: '#e2e8f0', axis: '#64748b', text: '#334155', origin: '#0f172a' };
      const l1 = Number($('l1').value), l2 = Number($('l2').value);
      const t1 = Number($('t1').value), t2 = Number($('t2').value);
      $('l1-out').textContent = fmt(l1); $('l2-out').textContent = fmt(l2);
      $('t1-out').textContent = `${t1}°`; $('t2-out').textContent = `${t2}°`;
      const x1 = l1 * Math.cos(rad(t1)), y1 = l1 * Math.sin(rad(t1));
      const x = x1 + l2 * Math.cos(rad(t1 + t2));
      const y = y1 + l2 * Math.sin(rad(t1 + t2));
      $('x1-value').textContent = fmt(x1); $('y1-value').textContent = fmt(y1);
      $('x-value').textContent = fmt(x); $('y-value').textContent = fmt(y);
      $('direction-value').textContent = `${t1 + t2}°`; $('radius-value').textContent = fmt(Math.hypot(x, y));

      const width = Math.max(320, canvas.clientWidth), height = Math.round(width / 1.25);
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, width, height);
      const scale = Math.min(width, height) / 12;
      const origin = { x: width / 2, y: height * .58 };
      const point = (px, py) => ({ x: origin.x + px * scale, y: origin.y - py * scale });
      for (let i = -5; i <= 5; i++) { drawLine(point(i, -5), point(i, 5), colors.grid, 1); drawLine(point(-5, i), point(5, i), colors.grid, 1); }
      drawLine(point(-5.5, 0), point(5.5, 0), colors.axis, 1.5); drawLine(point(0, -5), point(0, 5), colors.axis, 1.5);
      const o = point(0, 0), p1 = point(x1, y1), p2 = point(x, y);
      drawLine(o, p1, '#2563eb', 10); drawLine(p1, p2, '#f97316', 10);
      drawJoint(o, colors.origin); drawJoint(p1, '#2563eb'); drawJoint(p2, '#dc2626', 8);
      ctx.fillStyle = colors.text; ctx.font = '14px system-ui';
      ctx.fillText('O', o.x - 18, o.y + 20); ctx.fillText('E', p2.x + 11, p2.y - 10);
      ctx.fillText('x', width - 18, origin.y - 8); ctx.fillText('y', origin.x + 8, 18);
    }
    inputs.forEach((input) => input.addEventListener('input', update));
    new ResizeObserver(update).observe(canvas);
    update();
  </script>
</body>
</html>
