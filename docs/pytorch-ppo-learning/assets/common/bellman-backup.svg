<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">가치 함수의 한 스텝 Bellman 관계</title>
  <desc id="desc">현재 상태 가치가 즉시 보상과 할인된 다음 상태 가치의 기댓값으로 연결되는 그림</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.n{fill:#eef4ff;stroke:#2563eb;stroke-width:2}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#a)}.h{font-size:25px;font-weight:700}.t{font-size:20px}.m{font-size:18px;fill:#526174}@media(prefers-color-scheme:dark){text{fill:#edf3ff}.n{fill:#172943;stroke:#77a7ff}.arrow{stroke:#77a7ff}.m{fill:#bdc9da}}</style></defs>
  <rect class="n" x="55" y="100" width="220" height="105" rx="18"/><text class="h" x="165" y="145" text-anchor="middle">현재 가치</text><text class="t" x="165" y="180" text-anchor="middle">Vπ(sₜ)</text>
  <path class="arrow" d="M275 152H420"/><text class="t" x="347" y="130" text-anchor="middle">정책과 환경</text>
  <rect class="n" x="420" y="70" width="210" height="165" rx="18"/><text class="h" x="525" y="112" text-anchor="middle">한 스텝 결과</text><text class="t" x="525" y="153" text-anchor="middle">즉시 보상 rₜ</text><text class="t" x="525" y="190" text-anchor="middle">다음 상태 sₜ₊₁</text>
  <path class="arrow" d="M630 152H770"/>
  <rect class="n" x="770" y="100" width="160" height="105" rx="18"/><text class="h" x="850" y="145" text-anchor="middle">미래 가치</text><text class="t" x="850" y="180" text-anchor="middle">γVπ(sₜ₊₁)</text>
  <text class="h" x="490" y="292" text-anchor="middle">Vπ(sₜ) = 𝔼π[rₜ + γVπ(sₜ₊₁) | sₜ]</text>
  <text class="m" x="490" y="329" text-anchor="middle">critic target과 TD residual은 이 한 스텝 관계에서 나온다.</text>
</svg>

