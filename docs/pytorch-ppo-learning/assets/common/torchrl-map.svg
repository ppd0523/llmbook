<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
  <title id="title">직접 구현과 TorchRL 구성요소의 대응</title>
  <desc id="desc">Gymnasium 환경, Python rollout buffer, actor critic, GAE 함수와 PPO loss가 TorchRL의 GymEnv, TensorDict collector, ProbabilisticActor ValueOperator, GAE, ClipPPOLoss에 대응</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.left{fill:#f7f9fc;stroke:#8290a5;stroke-width:2}.right{fill:#eef4ff;stroke:#2563eb;stroke-width:2}.arrow{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#a)}.h{font-size:24px;font-weight:700}.t{font-size:19px}.m{font-size:16px;fill:#526174}@media(prefers-color-scheme:dark){text{fill:#edf3ff}.left{fill:#242b36;stroke:#94a0b3}.right{fill:#172943;stroke:#77a7ff}.arrow{stroke:#77a7ff}.m{fill:#bdc9da}}</style></defs>
  <text class="h" x="250" y="45" text-anchor="middle">순수 PyTorch 구현</text><text class="h" x="860" y="45" text-anchor="middle">TorchRL 0.13 primitive</text>
  <rect class="left" x="45" y="75" width="410" height="70" rx="14"/><text class="t" x="250" y="118" text-anchor="middle">gym.make(...) + step/reset loop</text>
  <rect class="right" x="665" y="75" width="410" height="70" rx="14"/><text class="t" x="870" y="118" text-anchor="middle">GymEnv · TransformedEnv</text><path class="arrow" d="M455 110H665"/>
  <rect class="left" x="45" y="170" width="410" height="70" rx="14"/><text class="t" x="250" y="213" text-anchor="middle">dict[str, Tensor] rollout buffer</text>
  <rect class="right" x="665" y="170" width="410" height="70" rx="14"/><text class="t" x="870" y="213" text-anchor="middle">TensorDict · Collector</text><path class="arrow" d="M455 205H665"/>
  <rect class="left" x="45" y="265" width="410" height="70" rx="14"/><text class="t" x="250" y="308" text-anchor="middle">ActorCritic.actor · .critic</text>
  <rect class="right" x="665" y="265" width="410" height="70" rx="14"/><text class="t" x="870" y="298" text-anchor="middle">ProbabilisticActor</text><text class="t" x="870" y="325" text-anchor="middle">ValueOperator</text><path class="arrow" d="M455 300H665"/>
  <rect class="left" x="45" y="360" width="410" height="70" rx="14"/><text class="t" x="250" y="403" text-anchor="middle">generalized_advantage_estimate(...)</text>
  <rect class="right" x="665" y="360" width="410" height="70" rx="14"/><text class="t" x="870" y="403" text-anchor="middle">torchrl.objectives.value.GAE</text><path class="arrow" d="M455 395H665"/>
  <rect class="left" x="45" y="455" width="410" height="70" rx="14"/><text class="t" x="250" y="498" text-anchor="middle">ratio · clamp · minimum · losses</text>
  <rect class="right" x="665" y="455" width="410" height="70" rx="14"/><text class="t" x="870" y="498" text-anchor="middle">ClipPPOLoss</text><path class="arrow" d="M455 490H665"/>
  <text class="m" x="560" y="555" text-anchor="middle">이름이 달라질 뿐, 수집 → advantage → clipped update라는 알고리즘 경계는 같다.</text>
</svg>
