<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">에이전트와 환경의 한 스텝 상호작용</title>
  <desc id="desc">관측이 환경에서 에이전트로, 행동이 에이전트에서 환경으로 가고, 환경이 다음 관측과 보상 및 종료 신호를 돌려주는 순환도</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033} .box{fill:#eef4ff;stroke:#2563eb;stroke-width:2} .signal{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)} .sub{fill:#526174;font-size:19px}.main{font-size:27px;font-weight:700}.label{font-size:21px;font-weight:700}
      @media(prefers-color-scheme:dark){text{fill:#eef4ff}.box{fill:#182338;stroke:#77a7ff}.signal{stroke:#77a7ff}.sub{fill:#bdc9da}}
    </style>
  </defs>
  <rect class="box" x="90" y="135" rx="20" width="280" height="150"/>
  <text class="main" x="230" y="195" text-anchor="middle">에이전트</text>
  <text class="sub" x="230" y="232" text-anchor="middle">정책 πθ가 행동을 선택</text>
  <rect class="box" x="590" y="135" rx="20" width="280" height="150"/>
  <text class="main" x="730" y="195" text-anchor="middle">환경</text>
  <text class="sub" x="730" y="232" text-anchor="middle">상태를 바꾸고 결과를 반환</text>
  <path class="signal" d="M370 185 C450 125 510 125 590 185"/>
  <text class="label" x="480" y="104" text-anchor="middle">행동 aₜ</text>
  <path class="signal" d="M590 255 C510 335 450 335 370 255"/>
  <text class="label" x="480" y="367" text-anchor="middle">다음 관측 oₜ₊₁ · 보상 rₜ · 종료 신호</text>
  <text class="sub" x="480" y="405" text-anchor="middle">Gymnasium: observation, reward, terminated, truncated, info</text>
</svg>

