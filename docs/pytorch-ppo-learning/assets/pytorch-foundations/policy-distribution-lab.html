<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Categorical 정책분포 실험실</title>
  <style>
    :root{color-scheme:light dark;--bg:light-dark(#f7f9fc,#111827);--panel:light-dark(#fff,#1f2937);--fg:light-dark(#172033,#eef4ff);--muted:light-dark(#526174,#bdc9da);--border:light-dark(#c8d1df,#526174);--a:light-dark(#2563eb,#77a7ff);--b:light-dark(#d36b22,#f1a469)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,"Noto Sans KR",sans-serif}main{max-width:850px;margin:auto;padding:24px}h1{font-size:1.55rem;margin:0 0 8px}p{color:var(--muted)}.control{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin:20px 0}input{width:100%;margin-top:10px}.value{color:var(--a);font-weight:700}.bars{display:grid;gap:16px}.row{display:grid;grid-template-columns:110px 1fr 82px;gap:12px;align-items:center}.track{height:42px;background:color-mix(in srgb,var(--border) 30%,transparent);border-radius:8px;overflow:hidden}.bar{height:100%;transition:width .2s}.left{background:var(--a)}.right{background:var(--b)}.num{text-align:right;font-variant-numeric:tabular-nums}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.metric{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}.metric b{display:block;font-size:1.25rem;margin-top:6px}.actions{margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{padding:9px 14px;border:0;border-radius:8px;background:var(--a);color:light-dark(#fff,#101827);font-weight:700;cursor:pointer}.sample{color:var(--muted)}@media(max-width:580px){main{padding:14px}.metrics{grid-template-columns:1fr}.row{grid-template-columns:86px 1fr 70px}}
  </style>
</head>
<body><main>
  <h1>Categorical 정책분포 실험실</h1>
  <p>actor는 행동 자체가 아니라 logits를 출력한다. `Categorical(logits=...)`가 이를 확률로 바꾸고 행동을 샘플링한다.</p>
  <div class="control"><label for="diff">오른쪽 logit − 왼쪽 logit = <span id="diffValue" class="value"></span></label><input id="diff" type="range" min="-6" max="6" step="0.1" value="0"></div>
  <div class="bars" aria-label="행동별 확률"><div class="row"><strong>왼쪽 a=0</strong><div class="track"><div id="leftBar" class="bar left"></div></div><span id="leftProb" class="num"></span></div><div class="row"><strong>오른쪽 a=1</strong><div class="track"><div id="rightBar" class="bar right"></div></div><span id="rightProb" class="num"></span></div></div>
  <section class="metrics"><div class="metric">entropy H<b id="entropy"></b></div><div class="metric">오른쪽 log_prob<b id="logprob"></b></div><div class="metric">exp(log_prob)<b id="expLogprob"></b></div></section>
  <div class="actions"><button id="sample">1,000번 샘플링</button><span id="sampleResult" class="sample">이론 확률과 샘플 빈도를 비교해 보자.</span></div>
</main><script>
  const slider=document.getElementById('diff');let current=[.5,.5];function update(){const d=Number(slider.value),p1=1/(1+Math.exp(-d)),p0=1-p1;current=[p0,p1];document.getElementById('diffValue').textContent=d.toFixed(1);document.getElementById('leftBar').style.width=`${p0*100}%`;document.getElementById('rightBar').style.width=`${p1*100}%`;document.getElementById('leftProb').textContent=p0.toFixed(3);document.getElementById('rightProb').textContent=p1.toFixed(3);const h=-(p0*Math.log(p0)+p1*Math.log(p1));document.getElementById('entropy').textContent=h.toFixed(3)+' nat';document.getElementById('logprob').textContent=Math.log(p1).toFixed(3);document.getElementById('expLogprob').textContent=Math.exp(Math.log(p1)).toFixed(3);document.getElementById('sampleResult').textContent='이론 확률과 샘플 빈도를 비교해 보자.'}
  document.getElementById('sample').addEventListener('click',()=>{let right=0;for(let i=0;i<1000;i++)if(Math.random()<current[1])right++;document.getElementById('sampleResult').textContent=`왼쪽 ${1000-right}회 · 오른쪽 ${right}회`});slider.addEventListener('input',update);update();
</script></body></html>
