<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PPO clipping 실험실</title>
  <style>
    :root{color-scheme:light dark;--bg:light-dark(#f7f9fc,#111827);--panel:light-dark(#fff,#1f2937);--fg:light-dark(#172033,#eef4ff);--muted:light-dark(#526174,#bdc9da);--border:light-dark(#c8d1df,#526174);--a:light-dark(#2563eb,#77a7ff);--b:light-dark(#d36b22,#f1a469);--c:light-dark(#24864b,#63cf88)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,"Noto Sans KR",sans-serif}main{max-width:960px;margin:auto;padding:24px}h1{font-size:1.55rem;margin:0 0 8px}p{color:var(--muted)}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin:18px 0}label{display:grid;gap:8px;font-weight:700}.value{color:var(--a)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.metric{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}.metric b{display:block;margin-top:5px;font-size:1.15rem}svg{width:100%;height:auto;background:var(--panel);border:1px solid var(--border);border-radius:14px}.axis{stroke:var(--border);stroke-width:1}.unclipped{stroke:var(--a);stroke-width:3;fill:none}.clipped{stroke:var(--b);stroke-width:3;fill:none;stroke-dasharray:8 5}.objective{stroke:var(--c);stroke-width:5;fill:none}.marker{fill:var(--fg)}.svgtext{fill:var(--fg);font-size:14px}.legend{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0;color:var(--muted)}.swatch{display:inline-block;width:24px;height:4px;margin-right:6px;vertical-align:middle}.explain{border-left:4px solid var(--c);padding:10px 14px;background:var(--panel)}@media(max-width:690px){main{padding:14px}.controls{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body><main>
  <h1>PPO clipping 실험실</h1><p>초록 선은 두 후보 중 더 작은 PPO 목적값이다. advantage 부호를 바꾸면 제한되는 ratio 방향도 바뀐다.</p>
  <section class="controls"><label>ratio r = <span id="ratioValue" class="value"></span><input id="ratio" type="range" min="0" max="2" step="0.01" value="1.35"></label><label>advantage A = <span id="advValue" class="value"></span><input id="adv" type="range" min="-3" max="3" step="0.1" value="2"></label><label>clip ε = <span id="epsValue" class="value"></span><input id="eps" type="range" min="0.05" max="0.5" step="0.01" value="0.2"></label></section>
  <section class="metrics"><div class="metric">r·A<b id="raw"></b></div><div class="metric">clip(r)·A<b id="clip"></b></div><div class="metric">min 결과<b id="min"></b></div><div class="metric">정책 loss = −결과<b id="loss"></b></div></section>
  <div class="legend"><span><i class="swatch" style="background:var(--a)"></i>r·A</span><span><i class="swatch" style="background:var(--b)"></i>clip(r)·A</span><span><i class="swatch" style="background:var(--c)"></i>min</span></div>
  <svg id="chart" viewBox="0 0 900 380" role="img" aria-label="ratio에 따른 PPO clipped objective 곡선"></svg><p id="explain" class="explain"></p>
</main><script>
  const ratio=document.getElementById('ratio'),adv=document.getElementById('adv'),eps=document.getElementById('eps'),svg=document.getElementById('chart'),ns='http://www.w3.org/2000/svg';function e(name,a){const n=document.createElementNS(ns,name);for(const[k,v]of Object.entries(a||{}))n.setAttribute(k,v);return n}function path(points,xs,ys){return points.map((p,i)=>`${i?'L':'M'}${xs(p[0])},${ys(p[1])}`).join(' ')}
  function draw(){const r=Number(ratio.value),A=Number(adv.value),ep=Number(eps.value),cr=Math.max(1-ep,Math.min(1+ep,r)),raw=r*A,cl=cr*A,obj=Math.min(raw,cl);document.getElementById('ratioValue').textContent=r.toFixed(2);document.getElementById('advValue').textContent=A.toFixed(1);document.getElementById('epsValue').textContent=ep.toFixed(2);document.getElementById('raw').textContent=raw.toFixed(3);document.getElementById('clip').textContent=cl.toFixed(3);document.getElementById('min').textContent=obj.toFixed(3);document.getElementById('loss').textContent=(-obj).toFixed(3);svg.innerHTML='';const L=72,T=30,W=770,H=280,x=x=>L+x/2*W,maxY=Math.max(1,Math.abs(A)*2),y=v=>T+H/2-v/maxY*(H/2-22);svg.append(e('line',{x1:L,y1:y(0),x2:L+W,y2:y(0),class:'axis'}));svg.append(e('line',{x1:x(1-ep),y1:T,x2:x(1-ep),y2:T+H,class:'axis'}));svg.append(e('line',{x1:x(1+ep),y1:T,x2:x(1+ep),y2:T+H,class:'axis'}));const points=Array.from({length:101},(_,i)=>{const q=i/50;return[q,q*A]}),clips=points.map(p=>[p[0],Math.max(1-ep,Math.min(1+ep,p[0]))*A]),mins=points.map((p,i)=>[p[0],Math.min(p[1],clips[i][1])]);svg.append(e('path',{d:path(points,x,y),class:'unclipped'}));svg.append(e('path',{d:path(clips,x,y),class:'clipped'}));svg.append(e('path',{d:path(mins,x,y),class:'objective'}));svg.append(e('circle',{cx:x(r),cy:y(obj),r:7,class:'marker'}));[['0',0],['1−ε',1-ep],['1',1],['1+ε',1+ep],['2',2]].forEach(([lab,v])=>{const t=e('text',{x:x(v),y:348,'text-anchor':'middle',class:'svgtext'});t.textContent=lab;svg.append(t)});const why=A>0?(r>1+ep?'좋았던 행동의 확률을 이미 충분히 올렸으므로 추가 이득을 제한한다.':'양의 advantage: 이 행동 확률을 올리는 방향이다.'):(A<0?(r<1-ep?'나빴던 행동의 확률을 이미 충분히 내렸으므로 추가 이득을 제한한다.':'음의 advantage: 이 행동 확률을 내리는 방향이다.'):'advantage가 0이면 이 샘플은 actor update에 기여하지 않는다.');document.getElementById('explain').textContent=why}
  [ratio,adv,eps].forEach(x=>x.addEventListener('input',draw));draw();
</script></body></html>
